name: Deploy Temp Mail

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify browser access to mail API
        run: |
          curl --fail --silent --show-error --dump-header api-headers.txt --output /dev/null \
            -H 'Origin: https://pipdrip1to1.github.io' \
            https://mail123.fr/api/v1/domains
          tr -d '\r' < api-headers.txt | grep -Eiq '^access-control-allow-origin: (\*|https://pipdrip1to1\.github\.io)$'
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
